<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWA Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="https://www.drwoofapparel.com.au/cdn/shop/files/logo_500px_-_Copy_-_Copy_256x256_bcd794f1-43f7-495d-9922-fd755f89c15f_128x128.png?v=1623821710">
<style>
:root{color-scheme:light;--dg:#23403c;--gold:#72b0ab;--bd:#e2e8f0;--hh:60px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Poppins',system-ui,sans-serif;background:#f4f8f7;color:#1c3532;-webkit-text-size-adjust:100%}
.top{position:fixed;top:0;left:0;right:0;min-height:60px;border-bottom:3px solid var(--gold);display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:0 20px;background:var(--dg);color:#fff;z-index:10}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px}.brand img{width:36px;height:36px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}.brand h1{margin:0;font:700 18px 'Poppins','Futura',sans-serif;letter-spacing:.4px}
.brand .sub{font-size:11px;opacity:.7;margin-top:1px}
.tabs{display:flex;gap:4px;align-self:stretch;align-items:flex-end}
.tab{white-space:nowrap;border:0;background:transparent;color:#c9cbe0;font:600 13.5px 'Poppins','Futura',sans-serif;letter-spacing:.3px;padding:0 20px;height:40px;border-radius:9px 9px 0 0;cursor:pointer}
.tab:hover{color:#fff}
.tab.on{background:#f4f8f7;color:var(--dg);box-shadow:inset 0 3px 0 var(--gold)}
.right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.grp{display:flex;align-items:center;gap:6px}
.grp .lb{font-size:9.5px;font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.5px}
.ctl{display:none;align-items:center;gap:8px}
.ctl.on{display:flex}
.btn{white-space:nowrap;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;border-radius:8px;font:600 12px 'Poppins',sans-serif;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.22)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;color:#d6d8ea;font:600 11.5px 'Poppins',sans-serif;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--gold);color:var(--dg)}
.seg button:focus-visible{outline:2px solid #72b0ab;outline-offset:1px}
.seg button:focus:not(:focus-visible){outline:none}
.clockbox{text-align:right;line-height:1.1;margin-right:4px}
.clockbox .l{font-size:9px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
.clockbox .c{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.pane{position:fixed;top:var(--hh);left:0;right:0;bottom:0;display:none}
.pane.on{display:block}
.rw{display:flex;height:100%}.rn{width:200px;flex:0 0 auto;background:#fff;border-right:1px solid #e2e8f0;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;transition:width .15s}
.rtg{width:40px;height:40px;border-radius:50%;border:2px solid #72b0ab;background:#23403c;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;margin:2px 0 14px 8px;flex:0 0 auto}.rtg svg{width:20px;height:20px}
.rh{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#64748b;padding:0 10px 8px;white-space:nowrap}
.ri{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-left:3px solid transparent;border-radius:8px;background:transparent;color:#334155;font:600 13px 'Poppins',sans-serif;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden}
.ri:hover{background:#fff9f0}.ri.on{background:#dceeed;color:#23403c;border-left-color:#72b0ab;font-weight:700}.ri .ic{width:18px;height:18px;flex:0 0 18px;color:#5b6e6b}.ri .ic svg{width:18px;height:18px;display:block}
.rtg{display:none!important}
#rfly{position:fixed;z-index:9999;display:none;max-width:280px;background:#fff;border:1px solid #d5e6e5;border-radius:10px;box-shadow:0 8px 24px rgba(35,64,60,.16);padding:8px 12px;pointer-events:none;font:500 12px Poppins,sans-serif;color:#5b6e6b}
#rfly.on{display:block}#rfly b{display:block;font-size:13px;color:#23403c;font-weight:600;margin-bottom:2px}
.rn.col .lb2{display:block!important;font-size:10px;line-height:1.2;font-weight:600;text-align:center;white-space:normal;margin-top:3px}
.rn.col .ri{flex-direction:column!important;align-items:center!important;gap:0!important;padding:8px 2px!important}
.rn.col{width:84px!important;padding:14px 8px}.rn.col .rtg{margin:2px auto 14px}.rn.col .rh,.rn.col .lb2{display:none}.rn.col .ri{justify-content:center;padding:10px 0}
.rb{flex:1;position:relative;min-width:0}.rb .sv{position:absolute;inset:0;display:none}.rb .sv.on{display:block}
body.dev-phone .rw{flex-direction:column}body.dev-phone .rn{width:auto;flex-direction:row;padding:6px 8px;border-right:0;border-bottom:1px solid #e2e8f0;overflow-x:auto}body.dev-phone .rtg,body.dev-phone .rh,body.dev-phone .ri .ic{display:none}
iframe{width:100%;height:100%;border:0;background:#f4f8f7}
.load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#64748b;font-size:13px;text-align:center;padding:20px}
.spin{width:26px;height:26px;border:3px solid #d5e6e5;border-top-color:var(--dg);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* iPad: tighter header */
body.dev-ipad .top{padding:0 14px;gap:6px 14px}
body.dev-ipad .tab{padding:0 14px}
/* Phone: two-row header (brand + view switch, then full-width tabs) */
body.dev-phone .top{padding:8px 10px 0;gap:6px 8px}
body.dev-phone .brand h1{font-size:15px}body.dev-phone .brand img{width:28px;height:28px}
body.dev-phone .brand .sub{font-size:10px}
body.dev-phone .tabs{order:3;flex:1 0 100%;align-self:auto}
body.dev-phone .tab{flex:1;padding:0 8px;height:36px;font-size:12.5px}
body.dev-phone .right{gap:6px}
body.dev-phone .grp .lb{display:none}
body.dev-phone .seg button{padding:4px 8px;font-size:11px}
body.dev-phone .clockbox .l{display:none}
body.dev-phone .clockbox .c{font-size:14px}
body.dev-phone .btn{padding:4px 9px;font-size:11px}
</style></head>

<script type="application/octet-stream" id="d-r-salesdata" data-src="data/r-salesdata.202611022000.dat"></script>
<script type="application/octet-stream" id="d-r-ibal28" data-src="data/r-ibal28.202611022000.dat"></script>
<script type="application/octet-stream" id="d-r-openpo" data-src="data/r-openpo.202611022000.dat"></script>
<script type="application/octet-stream" id="d-r-preorder" data-src="data/r-preorder.202611022000.dat"></script>
<script type="application/octet-stream" id="d-meet" data-src="data/meet.202611022000.dat"></script>
<script type="application/octet-stream" id="d-mbr" data-src="data/mbr.202611022000.dat"></script>
<script>
const FR={},LABEL={raw:"Raw Data",meet:"Meeting Mode Nov 1",mbr:"MBR"};
let CUR="raw";
// ── display mode: Laptop/PC (Compact · Standard · Large), iPad, Phone ──
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const autoDev=()=>{const w=Math.min(screen.width||innerWidth,innerWidth);return w<700?"phone":(w<1180||/iPad|Macintosh.*Mobile/.test(navigator.userAgent)&&"ontouchend" in document&&innerWidth<1400)?"ipad":"pc";};
const M={dev:store.get("dwa.dev")||autoDev(),size:store.get("dwa.size")||"compact"};
const ZOOM={pc:{compact:.8,standard:1.12,large:1.28},ipad:.9,phone:.82};   /* 2026-10-28 (user): Compact 20% smaller */
function devCSS(t){
  // Laptop/PC: Raw Data uses its own Compact/Standard/Large switch; Meeting Mode gets the same zoom steps
  let c="";
  if(M.dev==="pc"){ if(t!=="raw"||M.size==="compact")c+=`body{zoom:${ZOOM.pc[M.size]}!important}`; }
  else c+=`body{zoom:${ZOOM[M.dev]}!important}`;
  if(M.dev!=="pc"){
    c+=`.view-tabs{flex-wrap:nowrap!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
        .view-tab{flex:0 0 auto!important}
        main{padding-left:10px!important;padding-right:10px!important}`;
  }
  if(M.dev==="phone"){
    c+=`html body{padding-left:0!important}
        html body .view-tabs{position:static!important;width:auto!important;flex-direction:row!important;border-right:0!important;border-bottom:1px solid #e2e8f0!important;padding:6px 8px!important;overflow-x:auto!important}
        html body .view-tabs::before{display:none!important}
        html body .sb-toggle,html body .sb-h{display:none!important}
        html body.sb-collapsed{padding-left:0!important}
        html body.sb-collapsed .view-tabs{width:auto!important;padding:6px 8px!important}
        html body.sb-collapsed .view-tab .lbl{display:inline!important}
        html body .view-tab .ic{display:none!important}
        html body .view-tab{width:auto!important;flex:0 0 auto!important;border-left:0!important;border-bottom:3px solid transparent!important;border-radius:6px 6px 0 0!important;white-space:nowrap}
        html body .view-tab.active{border-bottom-color:#72b0ab!important}
        nav{display:none!important}
        .shell{display:block!important}
        .filters{gap:6px!important}
        .filter select,.filter input{min-width:0!important;max-width:46vw}
        .kbd{display:none!important}`;
  }
  return c;
}
/* 2026-10-28 (user: "size option is not working"): Raw Data sub-views other than Sales Data have no bridge, so the
   shell writes the zoom into their (same-origin blob) documents directly */
function rawZoom(){
  const z=M.dev==="pc"?ZOOM.pc[M.size]:ZOOM[M.dev];
  Object.entries(RF).forEach(([k,f])=>{ if(k==="salesdata"||!f.contentWindow) return; f.contentWindow.postMessage({type:"dwa-zoom",z},"*"); }); }
addEventListener("message",e=>{ if(e.data&&e.data.type==="dwa-raw-ready") rawZoom(); });
function applyFrame(t){
  if(t==="raw") rawZoom();
  const f=FR[t];if(!f||!f.contentWindow)return;
  f.contentWindow.postMessage({type:"dwa-mode",css:devCSS(t),size:(t==="raw"&&M.dev==="pc")?M.size:(t==="raw"?"compact":null)},"*");
}
addEventListener("message",e=>{if(e.data&&e.data.type==="dwa-ready")["raw","meet","mbr"].forEach(t=>{if(FR[t]&&FR[t].contentWindow===e.source)applyFrame(t);});});
function setMode(dev,size){
  if(dev)M.dev=dev;if(size)M.size=size;store.set("dwa.dev",M.dev);store.set("dwa.size",M.size);
  document.body.className="dev-"+M.dev;
  document.querySelectorAll("#dev button").forEach(b=>b.classList.toggle("on",b.dataset.dev===M.dev));
  document.querySelectorAll("#dty button").forEach(b=>b.classList.toggle("on",b.dataset.dty===M.size));
  document.getElementById("sizeGrp").style.display=M.dev==="pc"?"":"none";
  ["raw","meet","mbr"].forEach(applyFrame);
  fitTop();
}
function fitTop(){document.documentElement.style.setProperty("--hh",document.getElementById("top").offsetHeight+"px");}
addEventListener("resize",fitTop);
if(window.ResizeObserver)new ResizeObserver(fitTop).observe(document.getElementById("top"));

async function unpack(id){
  /* 2026-11-02 (user: faster GitHub load): the GitHub copy keeps the big payloads as separate gzip files (data-src),
     fetched only when their tab is first opened; the local file keeps them inline (base64) so it still works offline */
  const el=document.getElementById("d-"+id);
  let u;
  if(el.dataset.src){ const r=await fetch(el.dataset.src); if(!r.ok) throw new Error("could not load "+el.dataset.src+" ("+r.status+")"); u=new Uint8Array(await r.arrayBuffer()); }
  else { const b64=el.textContent.trim(), bin=atob(b64), n=bin.length; u=new Uint8Array(n); for(let i=0;i<n;i++)u[i]=bin.charCodeAt(i); }
  const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.getElementById("d-"+id).textContent="";
  return URL.createObjectURL(new Blob([txt],{type:"text/html"}));
}
const ready={raw:null,meet:null,mbr:null};
/* Raw Data sub-views (lazy, one frame each) */
const RK={"invgeo": "Inventory Search", "salesdata": "Sales Data", "ibal28": "Inventory Balance", "openpo": "Open PO", "preorder": "Pre-Order"}, RF={}, RR={}; let RCUR=null;
async function showRaw(k){
  RCUR=k; document.querySelectorAll(".ri").forEach(b=>b.classList.toggle("on",b.dataset.k===k)); store.set("dwa.rawv",k);
  const rb=document.getElementById("rb"); let sv=document.getElementById("sv-"+k);
  rb.querySelectorAll(".sv").forEach(x=>x.classList.toggle("on",x.id==="sv-"+k));
  if(sv) return;
  sv=document.createElement("div"); sv.className="sv on"; sv.id="sv-"+k; sv.innerHTML='<div class="load"><div class="spin"></div>Loading '+RK[k]+'…</div>'; rb.appendChild(sv);
  try{ if(!RR[k]) RR[k]=unpack("r-"+k); const url=await RR[k];
    const f=document.createElement("iframe"); f.title=RK[k]; f.src=url; f.style.visibility="hidden";
    f.onload=()=>{ f.style.visibility=""; sv.querySelector(".load")?.remove(); if(k==="salesdata"){ FR.raw=f; } applyFrame("raw"); };
    sv.appendChild(f); RF[k]=f;
  }catch(e){ sv.querySelector(".load").innerHTML="Could not open "+RK[k]+"<br><small>"+e+"</small>"; } }
document.querySelectorAll(".ri").forEach(b=>b.onclick=()=>showRaw(b.dataset.k));
document.getElementById("rtg").onclick=()=>{ const c=!document.getElementById("rn").classList.contains("col"); document.getElementById("rn").classList.toggle("col",c); store.set("dwa.rawcol",c?"1":"0"); };
document.getElementById("rn").classList.add("col");   /* 2026-10-28 (user): fixed collapsed */
(function(){ const fl=document.createElement("div"); fl.id="rfly"; document.body.appendChild(fl); const rn=document.getElementById("rn");
  rn.addEventListener("mouseover",e=>{ const b=e.target.closest&&e.target.closest(".ri"); if(!b) return; const r=b.getBoundingClientRect();
    fl.innerHTML=`<b>${b.dataset.l||b.title}</b><span>${b.dataset.d||""}</span>`; fl.style.top=(r.top+r.height/2-22)+"px"; fl.style.left=(r.right+8)+"px"; fl.classList.add("on"); });
  rn.addEventListener("mouseleave",()=>fl.classList.remove("on")); })();
async function show(t){
  CUR=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));
  fitTop();
  try{history.replaceState(null,"","#"+t);}catch(e){}
  if(t==="raw"){ if(!RCUR) showRaw(store.get("dwa.rawv")&&RK[store.get("dwa.rawv")]?store.get("dwa.rawv"):"invgeo"); return; }
  if(FR[t])return;
  FR[t]="loading";
  try{
    if(!ready[t])ready[t]=unpack(t);
    const url=await ready[t];
    const f=document.createElement("iframe");f.title=LABEL[t];f.src=url;f.style.visibility="hidden";
    FR[t]=f;f.onload=()=>{f.style.visibility="";document.querySelector("#p-"+t+" .load")?.remove();afterLoad(t,f);};
    document.getElementById("p-"+t).appendChild(f);
  }catch(e){
    document.querySelector("#p-"+t+" .load").innerHTML="Could not open "+LABEL[t]+". Please use a current version of Chrome, Edge, Safari or Firefox.<br><small>"+e+"</small>";
  }
}
function afterLoad(t,f){
  applyFrame(t);
}
document.querySelectorAll("#dev button").forEach(b=>b.onclick=()=>setMode(b.dataset.dev));
document.querySelectorAll("#dty button").forEach(b=>b.onclick=()=>setMode(null,b.dataset.dty));
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.t));
setMode();
show(location.hash==="#meet"?"meet":location.hash==="#mbr"?"mbr":"raw");
// unpack the other tab in the background so switching is quick (its frame is only drawn when opened)
setTimeout(()=>{ if(!ready.mbr)ready.mbr=unpack("mbr"); },1500);
/* GitHub copy: fetch Meeting Mode quietly after the first view is up, so the tab opens quickly */
if(document.getElementById("d-meet").dataset.src) setTimeout(()=>{ if(!ready.meet)ready.meet=unpack("meet"); },2500);   /* Meeting Mode and Sales Data decompress on first open */
</script>
</body></html>
